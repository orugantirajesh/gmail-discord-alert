name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'scan_and_alert.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H 72.60.192.209 >> ~/.ssh/known_hosts

      - name: Deploy script (file copy only -- no live run triggered by CI)
        run: |
          scp scan_and_alert.py root@72.60.192.209:/opt/gmail-discord-alert/scan_and_alert.py

      - name: Syntax-check the deployed file
        run: |
          ssh root@72.60.192.209 "/opt/gmail-discord-alert/venv/bin/python -m py_compile /opt/gmail-discord-alert/scan_and_alert.py && echo 'deployed file compiles cleanly'"
